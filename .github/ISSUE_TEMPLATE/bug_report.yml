name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include screenshots containing your chats or phone number.
  - type: input
    id: version
    attributes: { label: App version, placeholder: "0.1.0" }
    validations: { required: true }
  - type: input
    id: distro
    attributes: { label: Distribution and desktop, placeholder: "Linux Mint 22.3, Cinnamon, X11" }
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: Installed from
      options: [.deb, AppImage, AUR, source]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
