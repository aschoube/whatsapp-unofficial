name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Note: this app wraps WhatsApp Web. Anything requiring WhatsApp protocol
        access is out of scope — see CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: What would you like it to do? }
    validations: { required: true }
